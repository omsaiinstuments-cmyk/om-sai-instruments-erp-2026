<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Om Sai Instruments ERP</title>
<style>
:root {
  --navy:#12304a;
  --blue:#1769aa;
  --bg:#f3f6fa;
  --line:#dbe3ec;
  --text:#172534;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:15px/1.45 Arial,sans-serif;
}
header {
  background:var(--navy);
  color:white;
  padding:16px;
}
header h1 { margin:0 0 5px; font-size:21px; }
.wrap { max-width:1200px; margin:auto; padding:12px; }
.layout { display:grid; grid-template-columns:210px 1fr; gap:12px; }
.sidebar,.panel,.stat {
  background:white;
  border:1px solid var(--line);
  border-radius:10px;
}
.sidebar { padding:8px; height:max-content; }
.nav {
  width:100%; text-align:left; padding:10px;
  border:0; background:white; border-radius:7px;
  margin:2px 0; font-size:14px; cursor:pointer;
}
.nav.active { background:#e8f2fc; color:var(--blue); font-weight:bold; }
.panel { padding:15px; margin-bottom:12px; }
.panel h2 { margin:0 0 12px; font-size:19px; }
.stats {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px; margin-bottom:12px;
}
.stat { padding:14px; }
.stat strong { display:block; font-size:23px; }
.stat span { color:#64748b; font-size:12px; }
.formgrid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.field label {
  display:block; font-size:12px;
  font-weight:bold; margin-bottom:4px;
}
.field input,.field select,.field textarea {
  width:100%; padding:10px;
  border:1px solid #cbd5e1;
  border-radius:7px; font-size:14px;
  background:white;
}
.btn {
  border:0; border-radius:7px;
  background:var(--blue); color:white;
  padding:10px 13px; cursor:pointer;
  margin:4px 2px;
}
.secondary { background:#e8eef5; color:#172534; }
.danger { background:#b42318; color:white; }
.tablewrap { overflow-x:auto; margin-top:12px; }
table { width:100%; border-collapse:collapse; min-width:600px; font-size:13px; }
th,td { border-bottom:1px solid var(--line); padding:9px; text-align:left; }
th { background:#f7f9fc; }
.notice {
  padding:10px; background:#fff8e6;
  border:1px solid #f3d38a;
  border-radius:8px; margin-bottom:12px;
  font-size:13px;
}
.small { color:#64748b; font-size:12px; }
@media(max-width:700px) {
  .layout { grid-template-columns:1fr; }
  .sidebar { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); }
  .nav { font-size:12px; padding:9px; }
}
@media(max-width:400px) {
  .formgrid { grid-template-columns:1fr; }
}
@media print {
  header,.sidebar,.noprint,.btn { display:none!important; }
  .layout { display:block; }
}
</style>
</head>
<body>

<header>
  <h1>Om Sai Instruments ERP</h1>
  <div>Industrial Instruments • Sales • Purchase • Inventory</div>
</header>

<div class="wrap">
  <div class="notice">
    हा प्राथमिक ERP आहे. डेटा सध्या याच ब्राउझरमध्ये सेव्ह होतो.
    महत्त्वाचा व्यवसायाचा डेटा वापरण्यापूर्वी टेस्ट करा आणि नियमित बॅकअप घ्या.
  </div>

  <div class="layout">
    <nav class="sidebar" id="nav"></nav>
    <main id="app"></main>
  </div>
</div>

<script>
(function(){
"use strict";

const KEY="omSaiInstrumentsERP_v3";

function emptyDB(){
 return {
  products:[],
  customers:[],
  suppliers:[],
  sales:[],
  purchases:[],
  stock:[],
  serials:[],
  payments:[]
 };
}

function loadDB(){
 try {
  return Object.assign(
   emptyDB(),
   JSON.parse(localStorage.getItem(KEY)||"{}")
  );
 } catch(e) {
  return emptyDB();
 }
}

let db=loadDB();
let page="dashboard";
let language="en";

const menus=[
 ["dashboard","Dashboard","डॅशबोर्ड"],
 ["products","Product Master","प्रॉडक्ट"],
 ["customers","Customer Master","ग्राहक"],
 ["sales","Sales Entry / Invoice","सेल्स / बिल"],
 ["purchases","Purchase Entry","खरेदी"],
 ["stockio","Stock In / Out","स्टॉक आवक-जावक"],
 ["stockreg","Stock Register","स्टॉक रजिस्टर"],
 ["serials","Serial Number Register","सिरियल नंबर"],
 ["suppliers","Supplier Master","सप्लायर"],
 ["payments","Payment / Outstanding","पेमेंट / बाकी"],
 ["reports","Reports","रिपोर्ट्स"],
 ["backup","Backup / Restore","बॅकअप / रिस्टोर"]
];

function save(){
 localStorage.setItem(KEY,JSON.stringify(db));
 render();
}

function id(){
 return Date.now().toString(36)+Math.random().toString(36).slice(2,6);
}

function n(v){ return Number(v)||0; }

function money(v){
 return "₹"+n(v).toLocaleString("en-IN",{maximumFractionDigits:2});
}

function esc(v){
 return String(v??"").replace(/[&<>"']/g,function(c){
  return {
   "&":"&amp;","<":"&lt;",">":"&gt;",
   '"':"&quot;","'":"&#39;"
  }[c];
 });
}

function today(){
 return new Date().toISOString().slice(0,10);
}

function label(key){
 let x=menus.find(m=>m[0]===key);
 return x ? x[language==="mr"?2:1] : key;
}

function field(name,title,type="text",required=false){
 return `<div class="field">
 <label>${title}${required?" *":""}</label>
 <input name="${name}" type="${type}" ${required?"required":""}>
 </div>`;
}

function select(name,title,items,required=true){
 return `<div class="field">
 <label>${title}</label>
 <select name="${name}" ${required?"required":""}>
 <option value="">Select ${title}</option>
 ${items.map(x=>`<option value="${esc(x.id)}">${esc(x.name||x.code||x.serial)}</option>`).join("")}
 </select></div>`;
}

function form(title,fields){
 return `<section class="panel">
 <h2>${title}</h2>
 <form id="dataForm" class="formgrid">${fields}</form>
 <button class="btn" form="dataForm">Save</button>
 <button class="btn secondary" type="button"
 onclick="document.getElementById('dataForm').reset()">Clear</button>
 </section>`;
}

function table(headers,rows){
 return `<div class="tablewrap"><table>
 <thead><tr>${headers.map(x=>`<th>${x}</th>`).join("")}</tr></thead>
 <tbody>${rows.length?rows.join(""):
 `<tr><td colspan="${headers.length}">No records yet</td></tr>`}</tbody>
 </table></div>`;
}

function list(type,headers,columns){
 let rows=db[type].map(x=>{
  return `<tr>${columns.map(fn=>`<td>${esc(fn(x))}</td>`).join("")}
  <td><button class="btn danger" onclick="deleteRow('${type}','${x.id}')">Delete</button></td></tr>`;
 });
 return table([...headers,"Action"],rows);
}

window.deleteRow=function(type,recordId){
 if(confirm("Delete this record?")){
  db[type]=db[type].filter(x=>x.id!==recordId);
  save();
 }
};

window.go=function(p){
 page=p;
 render();
};

function addForm(type,make){
 let f=document.getElementById("dataForm");
 if(!f)return;

 f.onsubmit=function(e){
  e.preventDefault();
  let values=Object.fromEntries(new FormData(f).entries());
  let record=make(values);

  if(!record)return;

  record.id=id();
  db[type].push(record);
  save();
  alert("Record saved successfully.");
 };
}

function renderNav(){
 document.getElementById("nav").innerHTML=
 menus.map(m=>`<button class="nav ${page===m[0]?"active":""}"
 onclick="go('${m[0]}')">${m[language==="mr"?2:1]}</button>`).join("")+
 `<button class="nav" onclick="language=language==='en'?'mr':'en';render()">
 ${language==="en"?"मराठी":"English"}
 </button>`;
}

function render(){
 renderNav();
 let app=document.getElementById("app");
 let html="";

 if(page==="dashboard"){
  html=`<div class="stats">
  <div class="stat"><strong>${db.products.length}</strong><span>Products</span></div>
  <div class="stat"><strong>${db.customers.length}</strong><span>Customers</span></div>
  <div class="stat"><strong>${db.sales.length}</strong><span>Sales Invoices</span></div>
  <div class="stat"><strong>${db.suppliers.length}</strong><span>Suppliers</span></div>
  </div>
  <section class="panel"><h2>Dashboard</h2>
  <p>Total Sales: <b>${money(db.sales.reduce((s,x)=>s+n(x.total),0))}</b></p>
  <p>Total Purchases: <b>${money(db.purchases.reduce((s,x)=>s+n(x.total),0))}</b></p>
  <p>Serial Instruments: <b>${db.serials.length}</b></p>
  <p>Stock Entries: <b>${db.stock.length}</b></p>
  </section>`;
 }

 if(page==="products"){
  html=form("Add Product",
   field("code","Product Code","text",true)+
   field("name","Product Name","text",true)+
   field("make","Make / Brand")+
   field("model","Model")+
   field("unit","Unit (pcs / nos)")+
   field("opening","Opening Stock","number")+
   field("reorder","Reorder Level","number")+
   field("cost","Purchase Cost ₹","number")+
   field("price","Selling Price ₹","number")
  )+
  `<section class="panel"><h2>Product List</h2>
  ${list("products",["Code","Name","Make","Model","Unit","Opening","Reorder","Cost","Price"],
  [x=>x.code,x=>x.name,x=>x.make,x=>x.model,x=>x.unit,x=>x.opening,x=>x.reorder,x=>money(x.cost),x=>money(x.price)])}
  </section>`;

  addForm("products",f=>({
   code:f.code,name:f.name,make:f.make,model:f.model,
   unit:f.unit||"pcs",opening:n(f.opening),reorder:n(f.reorder),
   cost:n(f.cost),price:n(f.price)
  }));
 }

 if(page==="customers"){
  html=form("Add Customer",
   field("name","Customer Name","text",true)+
   field("mobile","Mobile")+
   field("email","Email","email")+
   field("gstin","GSTIN")+
   field("city","City")+
   field("address","Address")
  )+
  `<section class="panel"><h2>Customer List</h2>
  ${list("customers",["Name","Mobile","Email","GSTIN","City","Address"],
  [x=>x.name,x=>x.mobile,x=>x.email,x=>x.gstin,x=>x.city,x=>x.address])}
  </section>`;

  addForm("customers",f=>f);
 }

 if(page==="suppliers"){
  html=form("Add Supplier",
   field("name","Supplier Name","text",true)+
   field("mobile","Mobile")+
   field("email","Email","email")+
   field("gstin","GSTIN")+
   field("city","City")+
   field("address","Address")
  )+
  `<section class="panel"><h2>Supplier List</h2>
  ${list("suppliers",["Name","Mobile","Email","GSTIN","City","Address"],
  [x=>x.name,x=>x.mobile,x=>x.email,x=>x.gstin,x=>x.city,x=>x.address])}
  </section>`;

  addForm("suppliers",f=>f);
 }

 if(page==="sales"||page==="purchases"){
  let sale=page==="sales";
  let type=sale?"sales":"purchases";
  let parties=sale?db.customers:db.suppliers;

  html=form(sale?"Sales Entry / Invoice":"Purchase Entry",
   field("doc","Invoice / Bill No.","text",true)+
   select("party",sale?"Customer":"Supplier",parties)+
   field("date","Date","date",true)+
   select("product","Product",db.products)+
   field("qty","Quantity","number",true)+
   field("rate","Rate ₹","number",true)+
   field("paid","Amount Paid ₹","number")
  )+
  `<section class="panel"><h2>${sale?"Sales Invoices":"Purchase Bills"}</h2>
  ${list(type,["Document","Party","Date","Product","Qty","Total","Paid","Balance"],
  [x=>x.doc,x=>x.partyName,x=>x.date,x=>x.productName,x=>x.qty,x=>money(x.total),x=>money(x.paid),x=>money(x.total-x.paid)])}
  </section>`;

  addForm(type,f=>{
   let p=db.products.find(x=>x.id===f.product);
   let party=parties.find(x=>x.id===f.party);
   if(!p||!party){alert("Select a product and customer/supplier first.");return null;}
   let qty=n(f.qty),rate=n(f.rate),total=qty*rate,paid=n(f.paid);
   if(qty<=0||rate<0||paid<0||paid>total){
    alert("Please check quantity, rate and paid amount.");return null;
   }
   return {
    doc:f.doc,partyName:party.name,date:f.date,
    product:p.id,productName:p.name,qty:qty,rate:rate,
    total:total,paid:paid
   };
  });
 }

 if(page==="stockio"){
  html=form("Stock In / Out",
   select("product","Product",db.products)+
   `<div class="field"><label>Direction</label>
   <select name="direction"><option>In</option><option>Out</option></select></div>`+
   field("qty","Quantity","number",true)+
   field("date","Date","date",true)+
   field("reference","Reference / Bill No.")+
   field("notes","Notes")
  )+
  `<section class="panel"><h2>Stock Movement History</h2>
  ${list("stock",["Date","Product","Direction","Qty","Reference","Notes"],
  [x=>x.date,x=>db.products.find(p=>p.id===x.product)?.name||"",x=>x.direction,x=>x.qty,x=>x.reference,x=>x.notes])}
  </section>`;

  addForm("stock",f=>{
   if(!db.products.some(p=>p.id===f.product)||n(f.qty)<=0){
    alert("Select product and enter valid quantity.");return null;
   }
   return {product:f.product,direction:f.direction,qty:n(f.qty),date:f.date,reference:f.reference,notes:f.notes};
  });
 }

 if(page==="stockreg"){
  let rows=db.products.map(p=>{
   let incoming=db.stock.filter(x=>x.product===p.id&&x.direction==="In").reduce((s,x)=>s+n(x.qty),0)
    +db.purchases.filter(x=>x.product===p.id).reduce((s,x)=>s+n(x.qty),0);
   let outgoing=db.stock.filter(x=>x.product===p.id&&x.direction==="Out").reduce((s,x)=>s+n(x.qty),0)
    +db.sales.filter(x=>x.product===p.id).reduce((s,x)=>s+n(x.qty),0);
   let balance=n(p.opening)+incoming-outgoing;
   return `<tr><td>${esc(p.code)}</td><td>${esc(p.name)}</td><td>${p.opening}</td><td>${incoming}</td><td>${outgoing}</td><td>${balance}</td><td>${balance<=n(p.reorder)?"Low Stock":"OK"}</td></tr>`;
  });
  html=`<section class="panel"><h2>Stock Register</h2>
  ${table(["Code","Product","Opening","In","Out","Balance","Status"],rows)}</section>`;
 }

 if(page==="serials"){
  html=form("Serial Number Register",
   select("product","Product",db.products)+
   field("serial","Serial Number","text",true)+
   `<div class="field"><label>Status</label><select name="status">
   <option>In Stock</option><option>Sold</option><option>Under Calibration</option><option>Sent for Repair</option></select></div>`+
   field("customer","Customer / Location")+
   field("calibration","Last Calibration","date")+
   field("nextcal","Next Calibration Due","date")+
   field("certificate","Certificate Number")+
   field("warranty","Warranty Until","date")
  )+
  `<section class="panel"><h2>Serial Instruments</h2>
  ${list("serials",["Product","Serial","Status","Customer / Location","Last Cal.","Next Due","Certificate","Warranty"],
  [x=>db.products.find(p=>p.id===x.product)?.name||"",x=>x.serial,x=>x.status,x=>x.customer,x=>x.calibration,x=>x.nextcal,x=>x.certificate,x=>x.warranty])}
  </section>`;

  addForm("serials",f=>({product:f.product,serial:f.serial,status:f.status,customer:f.customer,calibration:f.calibration,nextcal:f.nextcal,certificate:f.certificate,warranty:f.warranty}));
 }

 if(page==="payments"){
  html=form("Payment / Outstanding Entry",
   `<div class="field"><label>Type</label><select name="type"><option>Receipt from Customer</option><option>Payment to Supplier</option></select></div>`+
   field("party","Customer / Supplier","text",true)+
   field("date","Date","date",true)+
   field("amount","Amount ₹","number",true)+
   field("reference","Invoice / Reference No.")+
   field("notes","Notes")
  )+
  `<section class="panel"><h2>Payment Records</h2>
  ${list("payments",["Type","Party","Date","Amount","Reference","Notes"],
  [x=>x.type,x=>x.party,x=>x.date,x=>money(x.amount),x=>x.reference,x=>x.notes])}
  </section>
  <section class="panel"><h2>Invoice Outstanding</h2>
  ${table(["Type","Party","Document","Total","Paid","Balance"],
   [...db.sales.map(x=>`<tr><td>Sale</td><td>${esc(x.partyName)}</td><td>${esc(x.doc)}</td><td>${money(x.total)}</td><td>${money(x.paid)}</td><td>${money(x.total-x.paid)}</td></tr>`),
   ...db.purchases.map(x=>`<tr><td>Purchase</td><td>${esc(x.partyName)}</td><td>${esc(x.doc)}</td><td>${money(x.total)}</td><td>${money(x.paid)}</td><td>${money(x.total-x.paid)}</td></tr>`)])}
  </section>`;

  addForm("payments",f=>({type:f.type,party:f.party,date:f.date,amount:n(f.amount),reference:f.reference,notes:f.notes}));
 }

 if(page==="reports"){
  html=`<section class="panel"><h2>Reports</h2>
  <p>Total Sales: <b>${money(db.sales.reduce((s,x)=>s+n(x.total),0))}</b></p>
  <p>Total Purchase: <b>${money(db.purchases.reduce((s,x)=>s+n(x.total),0))}</b></p>
  <p>Total Products: ${db.products.length}</p>
  <p>Total Customers: ${db.customers.length}</p>
  <button class="btn" onclick="window.print()">Print / Save PDF</button>
  <button class="btn secondary" onclick="go('stockreg')">Stock Report</button>
  <button class="btn secondary" onclick="go('payments')">Outstanding Report</button>
  </section>`;
 }

 if(page==="backup"){
  html=`<section class="panel"><h2>Backup / Restore</h2>
  <p>Download a backup of your ERP data before changing devices or editing the website.</p>
  <button class="btn" onclick="downloadBackup()">Download Backup JSON</button>
  <p>Restore an earlier JSON backup:</p>
  <input type="file" accept=".json,application/json" onchange="restoreBackup(event)">
  <p class="small">Restore replaces the records currently saved in this browser.</p>
  </section>`;
 }

 app.innerHTML=html;
}

window.downloadBackup=function(){
 let blob=new Blob([JSON.stringify({data:db},null,2)],{type:"application/json"});
 let url=URL.createObjectURL(blob);
 let a=document.createElement("a");
 a.href=url;a.download="om-sai-instruments-backup.json";
 a.click();URL.revokeObjectURL(url);
};

window.restoreBackup=function(event){
 let file=event.target.files[0];
 if(!file)return;
 let reader=new FileReader();
 reader.onload=function(){
  try{
   let obj=JSON.parse(reader.result);
   let incoming=obj.data||obj;
   if(!confirm("Restore backup? Current records will be replaced."))return;
   let next=emptyDB();
   Object.keys(next).forEach(k=>{
    if(Array.isArray(incoming[k]))next[k]=incoming[k];
   });
   db=next;
   localStorage.setItem(KEY,JSON.stringify(db));
   render();
   alert("Backup restored.");
  }catch(e){alert("Invalid backup file.");}
 };
 reader.readAsText(file);
};

render();
})();
</script>
</body>
</html>
